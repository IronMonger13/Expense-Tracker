{% load static %}

<nav class="navbar sm:navbar-expand bg-1 fg-2">
    <div class="container-fluid">
        <button class="btn-icon navbar-toggler"
                type="button"
                data-bs-toggle="drawer"
                data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end"
                tabindex="-1"
                id="navbarNavAltMarkup"
                aria-labelledby="navbarNavAltMarkupLabel">
            <div class="drawer-header">
                <h5 class="drawer-title" id="navbarNavAltMarkupLabel">Menu</h5>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="drawer"
                        aria-label="Close"></button>
            </div>
            <div class="drawer-body">
                <div class="nav nav-pills navbar-nav">
                    <a class="nav-link nav_items_user
                              {% if request.resolver_match.url_name == 'dashboard' %}
                                  active
                              {% endif %}"
                       href="{% url 'dashboard' %}">Dashboard</a>
                    <a class="nav-link nav_items_user
                              {% if request.resolver_match.url_name == 'transactions' %}
                                  active
                              {% endif %}"
                       href="{% url 'transactions' %}">Transactions</a>
                    <a class="nav-link nav_items_user
                              {% if request.resolver_match.url_name == 'add_transaction' %}
                                  active
                              {% endif %}"
                       href="{% url 'add_transaction' %}">Add Transaction</a>
                    <a class="nav-link nav_items_user
                              {% if request.resolver_match.url_name == 'settings' %}
                                  active
                              {% endif %}"
                       href="{% url 'settings' %}">Settings</a>
                </div>
            </div>
        </dialog>
    </div>
</nav>
<script type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
